apiVersion: apps/v1
kind: Deployment
metadata:
  name: whatsapp-family-vault
  labels:
    app: whatsapp-family-vault
spec:
  # Single replica is essential for embedded H2 database file locking
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: whatsapp-family-vault
  template:
    metadata:
      labels:
        app: whatsapp-family-vault
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: app
          image: whatsapp-family-vault:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: whatsapp-vault-config
            - secretRef:
                name: whatsapp-vault-secret
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: persistent-data
              mountPath: /app/data
            - name: app-logs
              mountPath: /app/logs
      volumes:
        - name: persistent-data
          persistentVolumeClaim:
            claimName: whatsapp-vault-pvc
        - name: app-logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: whatsapp-family-vault-service
  labels:
    app: whatsapp-family-vault
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app: whatsapp-family-vault
