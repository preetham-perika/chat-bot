apiVersion: v1
kind: ConfigMap
metadata:
  name: whatsapp-vault-config
  labels:
    app: whatsapp-family-vault
data:
  WHATSAPP_PROVIDER: "meta"
  WHATSAPP_API_VERSION: "v20.0"
  STORAGE_BASE_DIR: "/app/data/storage"
  STORAGE_DRIVE_SYNC_DIR: "/app/data/drive-sync"
  STORAGE_ENABLE_DRIVE_SYNC: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: whatsapp-vault-secret
  labels:
    app: whatsapp-family-vault
type: Opaque
stringData:
  WHATSAPP_VERIFY_TOKEN: "FAMILY_DOC_BOT_VERIFY_TOKEN"
  WHATSAPP_ACCESS_TOKEN: "CHANGE_TO_YOUR_PERMANENT_META_ACCESS_TOKEN"
  WHATSAPP_PHONE_NUMBER_ID: "CHANGE_TO_YOUR_PHONE_NUMBER_ID"
  WHATSAPP_ADMIN_PHONE_NUMBER: "919876543210"
  WHATSAPP_WHITELIST: "919876543211,919876543212"
